<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Daily Routine</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    #date {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .progress-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    #progress {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: 0.3s;
    }

    .task {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.07);
    }

    .task input {
      width: 20px;
      height: 20px;
    }

    .task span {
      flex: 1;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .add-box {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #222;
      color: white;
    }

    .reset-btn {
      width: 100%;
      margin-top: 15px;
      background: #e74c3c;
      color: white;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 My Daily Routine</h1>
  <div id="date"></div>

  <div class="progress-box">
    <strong>Today's Progress</strong>
    <p id="progressText">0 / 0 completed</p>

    <div class="progress-bar">
      <div id="progress"></div>
    </div>
  </div>

  <div id="tasks"></div>

  <div class="add-box">
    <input id="newTask" type="text" placeholder="Add a task...">
    <button class="add-btn" onclick="addTask()">Add</button>
  </div>

  <button class="reset-btn" onclick="resetDay()">
    🔄 Reset Today's Routine
  </button>

  <div id="message"></div>

</div>

<script>

const defaultTasks = [
  "Wake up",
  "Fix my bed",
  "Brush my teeth",
  "Eat breakfast",
  "Go to school",
  "Study",
  "Do homework",
  "Exercise",
  "Take a shower",
  "Prepare things for tomorrow",
  "Sleep"
];

let tasks = JSON.parse(localStorage.getItem("dailyTasks")) || defaultTasks.map(task => ({
  name: task,
  completed: false
}));

function saveTasks() {
  localStorage.setItem("dailyTasks", JSON.stringify(tasks));
}

function displayTasks() {

  const taskContainer = document.getElementById("tasks");
  taskContainer.innerHTML = "";

  tasks.forEach((task, index) => {

    const div = document.createElement("div");
    div.className = "task";

    div.innerHTML = `
      <input type="checkbox"
        ${task.completed ? "checked" : ""}
        onchange="toggleTask(${index})">

      <span class="${task.completed ? "completed" : ""}">
        ${task.name}
      </span>
    `;

    taskContainer.appendChild(div);
  });

  updateProgress();
}

function toggleTask(index) {

  tasks[index].completed = !tasks[index].completed;

  saveTasks();
  displayTasks();

  if (tasks.length > 0 &&
      tasks.every(task => task.completed)) {

    document.getElementById("message").textContent =
      "🔥 You completed everything today!";
  }
}

function addTask() {

  const input = document.getElementById("newTask");
  const taskName = input.value.trim();

  if (taskName === "") return;

  tasks.push({
    name: taskName,
    completed: false
  });

  input.value = "";

  saveTasks();
  displayTasks();
}

function updateProgress() {

  const completed = tasks.filter(task => task.completed).length;
  const total = tasks.length;

  const percentage =
    total === 0 ? 0 : (completed / total) * 100;

  document.getElementById("progress").style.width =
    percentage + "%";

  document.getElementById("progressText").textContent =
    `${completed} / ${total} completed`;
}

function resetDay() {

  if (!confirm("Reset today's routine?")) return;

  tasks.forEach(task => {
    task.completed = false;
  });

  document.getElementById("message").textContent = "";

  saveTasks();
  displayTasks();
}

function showDate() {

  const today = new Date();

  document.getElementById("date").textContent =
    today.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });
}

showDate();
displayTasks();

</script>

</body>
</html>
